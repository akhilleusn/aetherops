<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — AetherOps</title>
<link rel="icon" href="/weblogos/favicon_logo.ico" sizes="any">
<link rel="icon" href="/weblogos/logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="/weblogos/logo-180.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[data-theme="dark"]{
--bg:#080e18;--bg2:#0d1520;--card:#0f1a28;
--border:#1e2d3f;--border2:#2a3d52;
--text:#f0ead8;--text2:#c8bfa8;--muted:#7a8898;--dim:#4a5668;
--gold:#c9a84c;--gold2:#b8952a;
--err-bg:rgba(180,40,40,0.12);--err-border:rgba(200,60,60,0.28);--err-text:#fca5a5;
}
[data-theme="light"]{
--bg:#faf9f7;--bg2:#f2f0eb;--card:#ffffff;
--border:#ddd8cc;--border2:#c9c0ae;
--text:#0d1320;--text2:#2a3245;--muted:#6b7080;--dim:#9aa0ae;
--gold:#b8952a;--gold2:#9a7c20;
--err-bg:#fef2f2;--err-border:#fca5a5;--err-text:#991b1b;
}

/* Layout */
body{
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;
  background-color:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(circle,rgba(201,168,76,0.13) 1px,transparent 1px);
  background-size:40px 40px;
}
[data-theme="light"] body{
  background-image:radial-gradient(circle,rgba(20,40,90,0.06) 1px,transparent 1px);
}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100}
.logo{font-size:1.2rem;font-weight:700;color:var(--text);font-family:'Georgia',serif;text-decoration:none}
.logo span{color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:1rem}
.theme-btn{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--border2);color:var(--muted);padding:0.4rem 1rem;border-radius:4px;font-size:0.8125rem;cursor:pointer;font-family:-apple-system,sans-serif;transition:all 0.2s}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}

/* Page center */
.page-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem}

/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:32px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,0.12)}
[data-theme="dark"] .card{box-shadow:0 4px 28px rgba(0,0,0,0.45)}

h2{font-size:18px;font-weight:700;margin-bottom:24px;color:var(--text);font-family:'Georgia',serif}

/* Fields */
.field{margin-bottom:16px}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
[data-theme="light"] label{color:var(--text2)}

input[type=email],input[type=password],input[type=text]{
  width:100%;padding:9px 12px;
  background:var(--bg2);border:1px solid var(--border);border-radius:6px;
  color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s;
}
input[type=email]:focus,input[type=password]:focus,input[type=text]:focus{border-color:var(--gold)}
input::placeholder{color:var(--muted)}
[data-theme="light"] input::placeholder{color:var(--dim)}

/* TOTP input */
input[type=text]{letter-spacing:4px;text-align:center}
input[type=text].tenant-input{letter-spacing:normal;text-align:left}
.totp-hint{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

/* Submit button */
.btn-submit{
  width:100%;padding:10px;background:var(--gold);color:#fff;
  border:none;border-radius:6px;font-size:14px;font-weight:600;
  cursor:pointer;margin-top:8px;transition:background .15s;
}
.btn-submit:hover{background:var(--gold2)}
.btn-submit:disabled{opacity:0.5;cursor:not-allowed}

/* Error alert */
.err{background:var(--err-bg);border:1px solid var(--err-border);color:var(--err-text);padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}

/* Footer link */
.footer-link{text-align:center;margin-top:20px;font-size:13px;color:var(--muted)}
.footer-link a{color:var(--gold);text-decoration:none}
.footer-link a:hover{color:var(--gold2);text-decoration:underline}

/* Divider */
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--dim);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* Google button — stays recognisable in both themes */
.btn-google{
  width:100%;padding:10px;
  background:var(--bg2);color:var(--text);
  border:1px solid var(--border2);border-radius:6px;
  font-size:14px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;
}
.btn-google:hover{background:var(--bg);border-color:var(--gold)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}

/* Google tenant step helper text */
.step-hint{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
[data-theme="light"] .step-hint{color:var(--text2)}
</style>
<script src="https://accounts.google.com/gsi/client" async defer onload="window._googleReady?.()"></script>
</head>
<body>

<nav>
  <a class="logo" href="/landing.html">Aether<span>Ops</span></a>
  <div class="nav-right">
    <button class="theme-btn" onclick="toggleTheme()"><span id="themeLabel">Light mode</span></button>
  </div>
</nav>

<div class="page-center">
  <div class="card">
    <h2 id="card-title">Sign In</h2>
    <div class="err" id="err"></div>

    <div id="step-password">
      <div id="google-btn-wrap" style="display:none">
        <button class="btn-google" id="btn-google" onclick="triggerGoogle()">
          <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.4 2.9 13.3l7.9 6.1C12.7 13.2 17.9 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/><path fill="#FBBC05" d="M10.8 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.1.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l8.2-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.1 0-11.3-3.7-13.2-9l-8.2 6.1C6.7 42.6 14.7 48 24 48z"/></svg>
          Sign in with Google
        </button>
        <div class="divider">or</div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn-submit" id="btn" onclick="doLogin()">Sign In</button>
    </div>

    <div id="step-google-tenant" style="display:none">
      <p class="step-hint">
        This is your first time signing in with Google. Enter your organisation's Tenant ID to continue.
      </p>
      <div class="field">
        <label for="tenant-id">Tenant ID</label>
        <input id="tenant-id" type="text" class="tenant-input" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" autocomplete="off">
      </div>
      <button class="btn-submit" id="btn-tenant" onclick="doGoogleWithTenant()">Continue</button>
    </div>

    <div id="step-totp" style="display:none">
      <div class="field">
        <label for="totp-code">Authentication Code</label>
        <input id="totp-code" type="text" placeholder="000000" maxlength="8" autocomplete="one-time-code" inputmode="numeric">
        <p class="totp-hint">Enter the 6-digit code from your authenticator app, or an 8-character backup code.</p>
      </div>
      <button class="btn-submit" id="btn-totp" onclick="doVerifyTotp()">Verify</button>
    </div>
  </div>

  <div class="footer-link" id="footer-link">Don't have an account? <a href="/register.html">Register</a></div>
</div>

<script>
'use strict';

if (localStorage.getItem('ao_token')) {
  window.location.replace('/index.html');
}

let _partialToken   = null;
let _googleCredential = null;

// Initialise Google Sign-In if client ID is available
(async function initGoogle() {
  try {
    const r = await fetch('/api/v1/auth/google/client-id');
    const body = await r.json().catch(() => null);
    const clientId = body?.data?.clientId;
    if (!clientId) return;

    window._googleReady = () => {
      google.accounts.id.initialize({
        client_id: clientId,
        callback: onGoogleCredential,
        auto_select: false
      });
      document.getElementById('google-btn-wrap').style.display = 'block';
    };
    if (window.google?.accounts) window._googleReady();
  } catch (_) { /* silently hide Google button */ }
})();

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('step-totp').style.display !== 'none') doVerifyTotp();
    else doLogin();
  }
});

async function doLogin() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn');

  hideErr();
  if (!email || !password) { showErr('Email and password are required.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const r = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const body = await r.json().catch(() => null);
    if (!r.ok || !body?.success) {
      showErr(body?.message || 'Invalid email or password.');
      return;
    }
    const d = body.data;
    if (d.requiresTwoFactor) {
      _partialToken = d.partialToken;
      document.getElementById('step-password').style.display = 'none';
      document.getElementById('step-totp').style.display = 'block';
      document.getElementById('card-title').textContent = 'Two-Factor Authentication';
      document.getElementById('footer-link').style.display = 'none';
      document.getElementById('totp-code').focus();
      return;
    }
    storeAndRedirect(d);
  } catch (_) {
    showErr('Could not reach the server. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

async function doVerifyTotp() {
  const code    = document.getElementById('totp-code').value.trim();
  const btn     = document.getElementById('btn-totp');

  hideErr();
  if (!code) { showErr('Please enter your authentication code.'); return; }

  btn.disabled = true;
  btn.textContent = 'Verifying…';

  try {
    const r = await fetch('/api/v1/auth/2fa/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ partialToken: _partialToken, code })
    });
    const body = await r.json().catch(() => null);
    if (!r.ok || !body?.success) {
      showErr(body?.message || 'Invalid authentication code.');
      return;
    }
    storeAndRedirect(body.data);
  } catch (_) {
    showErr('Could not reach the server. Please try again.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify';
  }
}

function storeAndRedirect(d) {
  localStorage.setItem('ao_token',     d.token);
  localStorage.setItem('ao_email',     d.email);
  localStorage.setItem('ao_role',      d.role);
  localStorage.setItem('ao_tenant_id', d.tenantId);
  window.location.replace('/index.html');
}

function triggerGoogle() {
  if (window.google?.accounts) {
    google.accounts.id.prompt();
  }
}

async function onGoogleCredential(response) {
  _googleCredential = response.credential;
  hideErr();
  await doGoogleLogin(null);
}

async function doGoogleLogin(tenantId) {
  try {
    const payload = { idToken: _googleCredential };
    if (tenantId) payload.tenantId = tenantId;

    const r = await fetch('/api/v1/auth/google', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const body = await r.json().catch(() => null);

    if (r.ok && body?.success) {
      storeAndRedirect(body.data);
      return;
    }

    if (r.status === 422) {
      // New user — need tenant ID
      document.getElementById('step-password').style.display = 'none';
      document.getElementById('step-google-tenant').style.display = 'block';
      document.getElementById('card-title').textContent = 'Set Up Your Account';
      document.getElementById('footer-link').style.display = 'none';
      return;
    }

    showErr(body?.message || 'Google sign-in failed. Please try again.');
  } catch (_) {
    showErr('Could not reach the server. Please try again.');
  }
}

async function doGoogleWithTenant() {
  const tenantId = document.getElementById('tenant-id').value.trim();
  const btn = document.getElementById('btn-tenant');
  hideErr();
  if (!tenantId) { showErr('Please enter your Tenant ID.'); return; }

  btn.disabled = true;
  btn.textContent = 'Continuing…';
  try {
    await doGoogleLogin(tenantId);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Continue';
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideErr() {
  document.getElementById('err').style.display = 'none';
}

function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeLabel').textContent = isDark ? 'Dark mode' : 'Light mode';
}
</script>
</body>
</html>
