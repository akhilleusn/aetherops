spring:
  data:
    redis:
      # RedissonConfig (see RedissonConfig.java) reads these same properties so
      # that both Lettuce (Spring Data Redis) and Redisson share one source of truth.
      # Railway sets REDIS_HOST / REDIS_PORT; Kubernetes sets SPRING_DATA_REDIS_HOST
      # etc. which Spring Boot maps automatically via relaxed binding.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Password intentionally omitted here. Set SPRING_DATA_REDIS_PASSWORD (or
      # REDIS_PASSWORD read by RedissonConfig) in environments that require auth.
      # Leaving it absent keeps the value null so neither Lettuce nor Redisson
      # sends AUTH to an unauthenticated Redis instance.

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

analysis:
  use-stub: false

app:
  rate-limit:
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

resilience4j:
  circuitbreaker:
    instances:
      anthropic-ai:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.aetherops.common.exception.UsageLimitExceededException
          - com.aetherops.common.exception.ResourceNotFoundException
  bulkhead:
    instances:
      anthropic-ai:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
  retry:
    instances:
      anthropic-ai:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.aetherops.common.exception.UsageLimitExceededException
          - com.aetherops.common.exception.ResourceNotFoundException