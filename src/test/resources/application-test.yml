spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  jwt:
    secret: aetherops-test-secret-key-minimum-32-chars-long
  rate-limit:
    requests-per-window: 10000
    window-seconds: 60
  totp:
    encryption:
      current: 1
      keys:
        1: aetherops-totp-encryption-key-01
  slack:
    signing-secret: aetherops-test-slack-signing-secret
    oauth-state-secret: aetherops-test-slack-oauth-state-secret
    token:
      encryption:
        current: 1
        keys:
          1: aetherops-slack-token-enc-key-01
  calendar:
    token:
      encryption:
        current: 1
        keys:
          1: aetherops-calendar-token-key-012
    oauth-state-secret: aetherops-test-calendar-oauth-state-secret
  integrations:
    token:
      encryption:
        current: 1
        keys:
          1: aetherops-integr-token-enc-key01
