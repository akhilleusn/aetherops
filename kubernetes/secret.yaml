# =============================================================================
# AetherOps — Kubernetes Secret template
#
# THIS FILE IS A TEMPLATE.  Do NOT commit real credentials here.
# Replace every placeholder value with the base64-encoded real value before
# applying to any cluster.
#
# How to base64-encode a value (no trailing newline):
#
#   echo -n "your-actual-value" | base64
#
# The -n flag suppresses the trailing newline that `echo` normally appends.
# Without it the encoded value includes a newline character, which causes
# Spring Boot to see a password ending in \n and fail authentication.
#
# Example (macOS / Linux):
#   $ echo -n "my-secret-password" | base64
#   bXktc2VjcmV0LXBhc3N3b3Jk
#
# Example (Git Bash / WSL on Windows):
#   $ echo -n "my-secret-password" | base64
#   bXktc2VjcmV0LXBhc3N3b3Jk
#
# After encoding, replace the corresponding placeholder below and apply:
#   kubectl apply -f kubernetes/secret.yaml
#
# To rotate a secret without redeploying, update the value and run:
#   kubectl rollout restart deployment/aetherops -n aetherops
#
# SECURITY NOTE: Consider managing production secrets with a dedicated secrets
# manager (e.g. AWS Secrets Manager + External Secrets Operator, HashiCorp
# Vault Agent Injector) rather than storing this file in version control at
# all — even with placeholder values it trains teams to treat secrets as files.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: aetherops-secrets
  namespace: aetherops
  labels:
    app.kubernetes.io/name: aetherops
    app.kubernetes.io/part-of: aetherops
    app.kubernetes.io/managed-by: kubectl
# type: Opaque is the generic key-value secret type.  Use kubernetes.io/tls
# for TLS certificates (handled by cert-manager in ingress.yaml) and
# kubernetes.io/dockerconfigjson for registry pull credentials.
type: Opaque
data:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Full JDBC URL including host, port, database name, and SSL parameters.
  # Example plain value: jdbc:postgresql://postgres-service:5432/aetherops?sslmode=require
  # Encode: echo -n "jdbc:postgresql://postgres-service:5432/aetherops" | base64
  db-url: REPLACE_WITH_BASE64_ENCODED_JDBC_URL

  # PostgreSQL username for the application account (principle of least
  # privilege — do not use the superuser account).
  # Encode: echo -n "aetherops_app" | base64
  db-username: REPLACE_WITH_BASE64_ENCODED_DB_USERNAME

  # PostgreSQL password for the application account.
  # Encode: echo -n "your-db-password" | base64
  db-password: REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD

  # ── JWT signing key ────────────────────────────────────────────────────────
  # HS256/HS512 HMAC signing secret used by JwtService.  Must be at least
  # 256 bits (32 bytes) long for HS256 and 512 bits (64 bytes) for HS512.
  # Generate a suitable random key:
  #   openssl rand -base64 64
  # Then encode the result:
  #   echo -n "$(openssl rand -base64 64)" | base64
  jwt-secret: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET

  # ── Redis authentication ───────────────────────────────────────────────────
  # Redis AUTH password (requirepass in redis.conf).  If Redis runs without
  # authentication (e.g. in a private cluster namespace) this key can be
  # omitted and the secretKeyRef in deployment.yaml marked optional: true.
  # Encode: echo -n "your-redis-password" | base64
  redis-password: REPLACE_WITH_BASE64_ENCODED_REDIS_PASSWORD

  # ── Anthropic AI ───────────────────────────────────────────────────────────
  # API key for the Anthropic Claude API.  When absent the application
  # automatically falls back to the mock AI provider; mark the secretKeyRef
  # optional: true in deployment.yaml (already done).
  # Encode: echo -n "sk-ant-..." | base64
  anthropic-api-key: REPLACE_WITH_BASE64_ENCODED_ANTHROPIC_API_KEY

  # ── TOTP encryption key ────────────────────────────────────────────────────
  # AES key used by TotpSecretEncryptor to encrypt TOTP seeds at rest in the
  # database.  Must be exactly 32 ASCII characters (256-bit AES key).
  # Generate: openssl rand -hex 16   (produces 32 hex chars = 16 bytes)
  # Or use any 32-character alphanumeric string consistent across all replicas.
  # Encode: echo -n "your-32-char-totp-encryption-key" | base64
  totp-encryption-key: REPLACE_WITH_BASE64_ENCODED_TOTP_ENCRYPTION_KEY
