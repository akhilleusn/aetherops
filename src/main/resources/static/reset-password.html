<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — AetherOps</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: #0f172a;
  color: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.logo { font-size: 22px; font-weight: 700; color: #f8fafc; margin-bottom: 28px; text-align: center; }
.logo span { color: #60a5fa; }
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  box-shadow: 0 4px 24px rgba(0,0,0,.4);
  padding: 32px;
  width: 100%;
  max-width: 400px;
}
h2 { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
.subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
input[type=password] {
  width: 100%;
  padding: 9px 12px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 6px;
  color: #f8fafc;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .15s;
}
input[type=password]:focus { border-color: #2563eb; }
input::placeholder { color: #475569; }
.btn-submit {
  width: 100%;
  padding: 10px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: background .15s;
}
.btn-submit:hover { background: #1d4ed8; }
.btn-submit:disabled { background: #1e3a5f; cursor: not-allowed; }
.err {
  background: #2d1515;
  border: 1px solid #7f1d1d;
  color: #fca5a5;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.ok {
  background: #052e16;
  border: 1px solid #166534;
  color: #86efac;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.footer-link { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
.footer-link a { color: #60a5fa; text-decoration: none; }
.footer-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="logo">Aether<span>Ops</span></div>
<div class="card">
  <h2>Set New Password</h2>
  <p class="subtitle">Enter a new password for your account.</p>
  <div class="err" id="err"></div>
  <div class="ok"  id="ok"></div>
  <div class="field">
    <label for="password">New Password</label>
    <input id="password" type="password" placeholder="Min. 8 characters" autocomplete="new-password">
  </div>
  <div class="field">
    <label for="confirm">Confirm Password</label>
    <input id="confirm" type="password" placeholder="Repeat your new password" autocomplete="new-password">
  </div>
  <button class="btn-submit" id="btn" onclick="doReset()">Reset Password</button>
</div>
<div class="footer-link">Remembered it? <a href="/login.html">Sign in</a></div>

<script>
'use strict';

const params = new URLSearchParams(window.location.search);
const token  = params.get('token');

if (!token) {
  showErr('No reset token found. Please request a new password reset link.');
  document.getElementById('btn').disabled = true;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); });

async function doReset() {
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn      = document.getElementById('btn');

  hideMessages();

  if (!password || !confirm) { showErr('Both fields are required.'); return; }
  if (password.length < 8)   { showErr('Password must be at least 8 characters.'); return; }
  if (password !== confirm)  { showErr('Passwords do not match.'); return; }

  btn.disabled    = true;
  btn.textContent = 'Resetting…';

  try {
    const r = await fetch('/api/v1/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: password })
    });
    const body = await r.json().catch(() => null);

    if (r.ok && body?.success) {
      showOk('Password reset successfully! Redirecting to sign in…');
      setTimeout(() => window.location.replace('/login.html'), 2000);
      return;
    }

    if (r.status === 400) {
      showErr('This reset link is invalid or has expired. Please request a new one.');
    } else if (r.status === 422) {
      showErr(body?.details?.newPassword || 'Password must be at least 8 characters.');
    } else {
      showErr('Something went wrong. Please try again.');
    }
  } catch (_) {
    showErr('Could not reach the server. Please try again.');
  } finally {
    btn.disabled    = false;
    btn.textContent = 'Reset Password';
  }
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
}
function showOk(msg) {
  const el = document.getElementById('ok');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideMessages() {
  document.getElementById('err').style.display = 'none';
  document.getElementById('ok').style.display  = 'none';
}
</script>
</body>
</html>
