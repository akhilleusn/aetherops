spring:
  data:
    redis:
      # RedissonConfig (see RedissonConfig.java) reads these same properties so
      # that both Lettuce (Spring Data Redis) and Redisson share one source of truth.
      # Railway sets REDIS_HOST / REDIS_PORT; Kubernetes sets SPRING_DATA_REDIS_HOST
      # etc. which Spring Boot maps automatically via relaxed binding.
      host: ${REDIS_HOST:${REDISHOST:localhost}}
      password: ${REDIS_PASSWORD:${REDISPASSWORD:}}
      port: ${REDIS_PORT:${REDISPORT:6379}}
      # Password intentionally omitted here. Set SPRING_DATA_REDIS_PASSWORD (or
      # REDIS_PASSWORD read by RedissonConfig) in environments that require auth.
      # Leaving it absent keeps the value null so neither Lettuce nor Redisson
      # sends AUTH to an unauthenticated Redis instance.

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: true
    kafka:
      enabled: true
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

analysis:
  use-stub: false
  # No upstream limit on log message size today (see LogEventRequest) -- this is the one place
  # that caps what actually reaches an analysis provider's prompt, per evidence item. Tighten
  # this before enabling a real, billed provider.
  max-evidence-summary-chars: ${ANALYSIS_MAX_EVIDENCE_SUMMARY_CHARS:4000}

app:
  # Step H2 (see STEP_REPORT.md): default connect/read timeout applied to every outbound HTTP
  # client in this app that doesn't set its own (Slack, calendar, push/Expo, the Anthropic
  # health check, AWS SNS cert/subscription-confirm calls) via RestClientTimeoutConfig's
  # RestClientCustomizer/RestTemplateCustomizer beans. Jira, ServiceNow, and webhook delivery
  # configure their own (below) since SsrfGuard.disableRedirects needs its own explicit values.
  # Short deliberately: a call that needs longer than this has already failed for this product's
  # purposes (see STEP_REPORT.md's design discussion) -- every one of these targets (Slack API,
  # Google/Microsoft OAuth+calendar APIs, Expo push, Anthropic's own health endpoint, AWS SNS)
  # is a well-provisioned, low-latency API in normal operation.
  http-client:
    default-connect-timeout-ms: ${APP_HTTP_CLIENT_DEFAULT_CONNECT_TIMEOUT_MS:2000}
    default-read-timeout-ms: ${APP_HTTP_CLIENT_DEFAULT_READ_TIMEOUT_MS:3000}
  # The one deliberate exception to the short default above: the Anthropic Messages call
  # (AIProviderConfig) generates the whole analysis, thinking included, before responding, so
  # 3s always times out. Still bounded -- a call slower than this should fail, not hang.
  anthropic:
    read-timeout-ms: ${APP_ANTHROPIC_READ_TIMEOUT_MS:60000}
  # Step H2: dedicated, isolated thread pools for the three areas that used to share Spring
  # Boot's one default @Async executor (core size 8, effectively unbounded queue -- see
  # AsyncExecutorConfig's javadoc for why that means no isolation and no backpressure). Bounded
  # queues + AbortPolicy (explicit here, matches Spring's own default) so a saturated area
  # rejects loudly instead of queueing silently and indefinitely.
  async:
    paging:
      core-pool-size: ${APP_ASYNC_PAGING_CORE_POOL_SIZE:4}
      max-pool-size: ${APP_ASYNC_PAGING_MAX_POOL_SIZE:4}
      queue-capacity: ${APP_ASYNC_PAGING_QUEUE_CAPACITY:50}
    slack:
      core-pool-size: ${APP_ASYNC_SLACK_CORE_POOL_SIZE:4}
      max-pool-size: ${APP_ASYNC_SLACK_MAX_POOL_SIZE:8}
      queue-capacity: ${APP_ASYNC_SLACK_QUEUE_CAPACITY:100}
    webhook:
      core-pool-size: ${APP_ASYNC_WEBHOOK_CORE_POOL_SIZE:4}
      max-pool-size: ${APP_ASYNC_WEBHOOK_MAX_POOL_SIZE:8}
      queue-capacity: ${APP_ASYNC_WEBHOOK_QUEUE_CAPACITY:100}
  jwt:
    # Phase 1 Step B, item 6: cut from the prior 24h default. Role is a JWT claim, not
    # reloaded per request, so this is also the window a demoted/removed user keeps acting
    # under their old role. 1h (not the originally-requested 15m) because the frontend
    # (index.html/dashboard.html) has no refresh-on-401 flow yet — it only ever logs the
    # user out on 401 — so a shorter TTL would silently log out idle users. Revisit once
    # that refresh flow exists.
    expiry-hours: ${JWT_EXPIRY_HOURS:1}
  security:
    # Phase 1 Step C, item 1: number of trusted reverse-proxy hops in front of the app.
    # ClientIpResolver counts this many entries in from the RIGHT of X-Forwarded-For to find
    # the real client IP — everything to the left is attacker-suppliable. Default 1 suits a
    # single appending proxy (e.g. kubernetes/ingress.yaml). Production (GCP external
    # Application Load Balancer -> Cloud Run, ingress restricted to the load balancer) sets
    # APP_SECURITY_TRUSTED_PROXY_COUNT instead: the load balancer appends "<client>, <lb-ip>".
    # Verify against live traffic with DEBUG logging on ClientIpResolver (see its javadoc).
    trusted-proxy-count: ${APP_SECURITY_TRUSTED_PROXY_COUNT:1}
  rate-limit:
    requests-per-window: ${RATE_LIMIT_REQUESTS_PER_WINDOW:100}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  # Public read-only demo (PublicDemoFilter / PublicDemoController). Off unless tenant-id is set.
  # Point it ONLY at a dedicated demo tenant: everything in that tenant becomes public.
  public-demo:
    tenant-id: ${APP_PUBLIC_DEMO_TENANT_ID:}
    requests-per-window: ${APP_PUBLIC_DEMO_REQUESTS_PER_WINDOW:60}
    window-seconds: ${APP_PUBLIC_DEMO_WINDOW_SECONDS:60}
  dashboard-base-url: ${DASHBOARD_BASE_URL:http://localhost:8080}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  sso:
    sp-entity-id: ${SSO_SP_ENTITY_ID:aetherops}
    frontend-callback-url: ${SSO_FRONTEND_CALLBACK_URL:http://localhost:8080/sso-callback.html}
  suppression:
    noisy-alert-threshold: ${SUPPRESSION_NOISY_ALERT_THRESHOLD:10}
    auto-mute-minutes: ${SUPPRESSION_AUTO_MUTE_MINUTES:30}
  escalation:
    default-escalate-after-minutes: ${ESCALATION_DEFAULT_MINUTES:5}
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/slack/oauth/callback}
    # app.slack.token.encryption.keys / .current intentionally have no entry here (like
    # app.totp.encryption), same as app.calendar.token.encryption and
    # app.integrations.token.encryption below — versioned secret master key material
    # (AES-256 per version, see VersionedAesGcmEncryptor / Phase 3 finding 1 in
    # STEP_REPORT.md), required via env var only, never defaulted in a committed file:
    #   APP_SLACK_TOKEN_ENCRYPTION_CURRENT=1
    #   APP_SLACK_TOKEN_ENCRYPTION_KEYS_1=<32-byte secret>
  # app.calendar.token.encryption and app.integrations.token.encryption are the same kind of
  # versioned secret master key material (for calendar OAuth refresh tokens and Jira/
  # ServiceNow API tokens / inbound webhook signing secrets respectively) — also required via
  # env var only (APP_CALENDAR_TOKEN_ENCRYPTION_CURRENT/_KEYS_n,
  # APP_INTEGRATIONS_TOKEN_ENCRYPTION_CURRENT/_KEYS_n), never defaulted here.
  # app.calendar.oauth-state-secret (APP_CALENDAR_OAUTH_STATE_SECRET) and
  # app.slack.oauth-state-secret (APP_SLACK_OAUTH_STATE_SECRET) are the HMAC signing secrets
  # CalendarOAuthStateService/SlackOAuthStateService use for their respective OAuth "state"
  # params — each its own dedicated key, deliberately NOT app.slack.signing-secret (that value
  # is Slack-provided, for verifying INBOUND requests FROM Slack; reusing it here would couple
  # two independent trust domains — Phase 3 finding 4, see STEP_REPORT.md). Required via env
  # var only, never defaulted here.
  # Step H2 (see STEP_REPORT.md): Jira/ServiceNow ticket creation timeouts + the bounded total
  # wait TicketController's caller thread blocks on (JiraApiClient/ServiceNowApiClient run on
  # their own resilience4j THREADPOOL bulkhead, not the caller's thread -- call-timeout-ms is the
  # caller's backstop in case that pool itself is momentarily saturated, on top of the HTTP call
  # already being bounded by connect+read). No retry on either integration -- see
  # JiraTicketService's javadoc for why (non-idempotent POST, no idempotency key).
  integrations:
    jira:
      connect-timeout-ms: ${APP_INTEGRATIONS_JIRA_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${APP_INTEGRATIONS_JIRA_READ_TIMEOUT_MS:5000}
      call-timeout-ms: ${APP_INTEGRATIONS_JIRA_CALL_TIMEOUT_MS:9000}
    servicenow:
      connect-timeout-ms: ${APP_INTEGRATIONS_SERVICENOW_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${APP_INTEGRATIONS_SERVICENOW_READ_TIMEOUT_MS:5000}
      call-timeout-ms: ${APP_INTEGRATIONS_SERVICENOW_CALL_TIMEOUT_MS:9000}
  webhooks:
    # See MonitoringAlertReplayGuard's javadoc.
    replay-window-seconds: ${APP_WEBHOOKS_REPLAY_WINDOW_SECONDS:30}
    # Step H2 (see STEP_REPORT.md): tenant webhook endpoints are arbitrary third-party
    # infrastructure we don't control -- a bit more slack than the default bucket since delivery
    # can involve real server-side work on the receiving end, but still short (see
    # SsrfGuard.disableRedirects, which these are passed into directly).
    delivery-connect-timeout-ms: ${APP_WEBHOOKS_DELIVERY_CONNECT_TIMEOUT_MS:3000}
    delivery-read-timeout-ms: ${APP_WEBHOOKS_DELIVERY_READ_TIMEOUT_MS:5000}
    migration:
      # See LegacyWebhookSecretBackfillRunner's javadoc: a one-time backfill for tenants that
      # existed before per-provider static-token secrets did. Off by default — turn on for one
      # deploy to run it, then back off. Never intended to run on every startup.
      backfill-legacy-secrets: ${APP_WEBHOOKS_MIGRATION_BACKFILL_LEGACY_SECRETS:false}
      grace-period-days: ${APP_WEBHOOKS_MIGRATION_GRACE_PERIOD_DAYS:30}
      # Blank (the default) means "not configured." The runner REFUSES to generate any secrets
      # unless this is set or the --print-secrets CLI flag is passed — never logged either way.
      # See LegacyWebhookSecretBackfillRunner's javadoc.
      secrets-output-path: ${APP_WEBHOOKS_MIGRATION_SECRETS_OUTPUT_PATH:}

resilience4j:
  circuitbreaker:
    instances:
      anthropic-ai:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.aetherops.common.exception.UsageLimitExceededException
          - com.aetherops.common.exception.ResourceNotFoundException
      # Step H2 (see STEP_REPORT.md): jira-ticket/servicenow-ticket -- non-critical integrations,
      # so unlike paging it's safe (and useful) to stop attempting a POST once the provider is
      # clearly down. SsrfBlockedException ignored -- a rejected baseUrl is a permanent
      # configuration problem, not transient provider unhealthiness, so it shouldn't count toward
      # the failure rate (same reasoning anthropic-ai already applies to its own non-transient
      # exceptions). Deliberately NO retry instance for either -- see JiraTicketService's javadoc:
      # a retried POST after a timed-out-but-actually-succeeded create risks a duplicate ticket,
      # and there's no idempotency key in either integration to make that safe.
      jira-ticket:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.aetherops.common.exception.SsrfBlockedException
      servicenow-ticket:
        register-health-indicator: true
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - com.aetherops.common.exception.SsrfBlockedException
      # Step H2: calendar -- safe specifically because PtoAwarenessService already fails open on
      # any exception from these clients (see their javadoc); tripping the breaker just makes a
      # known-down provider fail (and therefore fail open) faster instead of waiting out a full
      # connect+read timeout on every rotation participant on every page attempt. Google and
      # Outlook get separate instances so one provider being down doesn't degrade checks against
      # the other. No retry -- paging should fail open immediately, not wait through a retry's
      # backoff first.
      calendar-google:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      calendar-outlook:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  bulkhead:
    instances:
      anthropic-ai:
        max-concurrent-calls: 10
        max-wait-duration: 100ms
  # Step H2: THREADPOOL bulkhead type (not the default SEMAPHORE) for jira-ticket/
  # servicenow-ticket specifically because it moves the actual HTTP call onto its own dedicated
  # pool instead of just limiting how many callers can run it concurrently on their own thread --
  # this is what "off the request thread" means for these two (see JiraTicketService's javadoc
  # for why bounded-wait-on-a-dedicated-pool was chosen over true fire-and-forget async).
  thread-pool-bulkhead:
    instances:
      jira-ticket:
        core-thread-pool-size: ${RESILIENCE4J_JIRA_BULKHEAD_CORE_POOL_SIZE:4}
        max-thread-pool-size: ${RESILIENCE4J_JIRA_BULKHEAD_MAX_POOL_SIZE:4}
        queue-capacity: ${RESILIENCE4J_JIRA_BULKHEAD_QUEUE_CAPACITY:10}
      servicenow-ticket:
        core-thread-pool-size: ${RESILIENCE4J_SERVICENOW_BULKHEAD_CORE_POOL_SIZE:4}
        max-thread-pool-size: ${RESILIENCE4J_SERVICENOW_BULKHEAD_MAX_POOL_SIZE:4}
        queue-capacity: ${RESILIENCE4J_SERVICENOW_BULKHEAD_QUEUE_CAPACITY:10}
  retry:
    instances:
      anthropic-ai:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        ignore-exceptions:
          - com.aetherops.common.exception.UsageLimitExceededException
          - com.aetherops.common.exception.ResourceNotFoundException
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}
  # Step H2 (see STEP_REPORT.md): the Twilio SDK's own built-in default (confirmed by decompiling
  # twilio-9.0.0.jar, not assumed) is connect=10000ms / socket(read)=30500ms -- bounded, but not
  # short. Paging is the one call where a slow success is close to useless: EscalationService's
  # SMS→push→Slack fallback should already have moved on well before 30.5s. Tightened explicitly
  # per instruction rather than left as an inherited SDK default -- see TwilioConfig's javadoc
  # for the full reasoning and where these are wired in (Twilio.setRestClient, not Spring's
  # RestClient -- the SDK has its own separate HTTP client).
  connect-timeout-ms: ${TWILIO_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${TWILIO_READ_TIMEOUT_MS:5000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id-starter: ${STRIPE_PRICE_ID_STARTER:}
  price-id-team: ${STRIPE_PRICE_ID_TEAM:}
  price-id-growth: ${STRIPE_PRICE_ID_GROWTH:}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/billing.html?checkout=success}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/billing.html?checkout=cancel}
  portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:8080/billing.html}

server:
  port: ${PORT:8080}
