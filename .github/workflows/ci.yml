name: CI — Test & Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # pom.xml surefire config hardcodes DOCKER_HOST=tcp://localhost:2375.
      # Bridge the GitHub Actions Unix socket to TCP so Testcontainers works
      # without changing the pom.xml (socat is pre-installed on ubuntu-latest).
      - name: Expose Docker over TCP for Testcontainers
        run: |
          nohup sudo socat TCP-LISTEN:2375,fork,reuseaddr \
            UNIX-CONNECT:/var/run/docker.sock &>/dev/null &
          sleep 2

      - name: Run tests
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: mvn clean test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  # ─── Build & Push ──────────────────────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    # Only run on direct pushes to master, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/akhilleusn/aetherops:latest
            ghcr.io/akhilleusn/aetherops:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          # Layer caching via GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image digest to job summary
        run: |
          {
            echo "### Docker Image Published"
            echo ""
            echo "| Field    | Value |"
            echo "|----------|-------|"
            echo "| Registry | \`ghcr.io/akhilleusn/aetherops\` |"
            echo "| Tags     | \`latest\`, \`${{ github.sha }}\` |"
            echo "| Digest   | \`${{ steps.push.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
