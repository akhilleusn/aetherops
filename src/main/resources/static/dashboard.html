<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AetherOps — Demo Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
/* ── Reset & tokens ──────────────────────────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
html{transition:background-color .25s,color .25s}

[data-theme="dark"]{
  --bg:#080e18;--bg2:#0d1520;--bg3:#121e2e;--card:#0f1a28;
  --border:#1e2d3f;--border2:#2a3d52;
  --text:#f0ead8;--text2:#c8bfa8;--muted:#7a8898;--dim:#4a5668;
  --gold:#c9a84c;--gold2:#b8952a;
  --crit:#ef4444;--high:#f97316;--med:#f59e0b;--low:#60a5fa;
  --open:#ef4444;--invest:#f97316;--resolved:#22c55e;--closed:#6b7280;
  --conf-high:#22c55e;--conf-med:#f59e0b;--conf-low:#ef4444;
}
[data-theme="light"]{
  --bg:#faf9f7;--bg2:#f2f0eb;--bg3:#e8e4dc;--card:#ffffff;
  --border:#ddd8cc;--border2:#c9c0ae;
  --text:#0d1320;--text2:#2a3245;--muted:#6b7080;--dim:#9aa0ae;
  --gold:#b8952a;--gold2:#9a7c20;
  --crit:#dc2626;--high:#ea580c;--med:#d97706;--low:#2563eb;
  --open:#dc2626;--invest:#ea580c;--resolved:#16a34a;--closed:#6b7280;
  --conf-high:#16a34a;--conf-med:#d97706;--conf-low:#dc2626;
}

body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

/* ── Boot screen ────────────────────────────────────────────────────────── */
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .3s}
.boot-inner{text-align:center}
.boot-logo{font-family:'Georgia',serif;font-size:1.75rem;font-weight:700;color:var(--text);margin-bottom:.5rem}
.boot-logo span{color:var(--gold)}
.boot-sub{font-size:.875rem;color:var(--muted);margin-bottom:1.75rem}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Error screen ────────────────────────────────────────────────────────── */
#err-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:998;align-items:center;justify-content:center}
#err-screen.show{display:flex}
.err-inner{text-align:center;max-width:400px;padding:2rem}
.err-inner i{font-size:2rem;color:var(--crit);margin-bottom:1rem}
.err-inner h2{font-family:'Georgia',serif;font-size:1.375rem;margin-bottom:.5rem;color:var(--text)}
.err-inner p{font-size:.875rem;color:var(--muted);line-height:1.6;margin-bottom:1.5rem}
.btn-retry{background:var(--gold);color:#fff;border:none;padding:.6rem 1.5rem;border-radius:4px;font-size:.875rem;font-weight:500}
.btn-retry:hover{background:var(--gold2)}

/* ── App shell ───────────────────────────────────────────────────────────── */
#app{display:none;flex-direction:column;height:100vh}

/* ── Nav ─────────────────────────────────────────────────────────────────── */
nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:52px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;gap:1rem}
.nav-left{display:flex;align-items:center;gap:.75rem}
.logo{font-family:'Georgia',serif;font-size:1.1rem;font-weight:700;color:var(--text);white-space:nowrap}
.logo span{color:var(--gold)}
.demo-badge{font-size:.6875rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:3px;background:var(--gold);color:#fff}
.nav-stats{display:flex;align-items:center;gap:.5rem;flex:1;justify-content:center}
.stat-chip{display:flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:500;padding:.25rem .6rem;border-radius:20px;border:1px solid var(--border2);background:var(--bg2);color:var(--muted);white-space:nowrap}
.stat-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-total{background:var(--gold)}
.dot-open{background:var(--open)}
.dot-crit{background:var(--crit)}
.dot-res{background:var(--resolved)}
.nav-right{display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.nav-link{font-size:.8125rem;color:var(--muted);padding:.3rem .6rem;border-radius:4px;transition:color .2s}
.nav-link:hover{color:var(--gold)}
.theme-btn{display:flex;align-items:center;gap:5px;background:transparent;border:1px solid var(--border2);color:var(--muted);padding:.3rem .75rem;border-radius:4px;font-size:.75rem;transition:all .2s}
.theme-btn:hover{border-color:var(--gold);color:var(--gold)}
.theme-btn i{font-size:14px}

/* ── Main layout ─────────────────────────────────────────────────────────── */
.layout{display:grid;grid-template-columns:320px 1fr;flex:1;min-height:0}

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
.sidebar{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg2);min-height:0}
.sidebar-head{padding:.875rem .875rem .625rem;border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap{position:relative;margin-bottom:.625rem}
.search-wrap i{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
#search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:.45rem .65rem .45rem 2rem;font-size:.8125rem;color:var(--text);outline:none;transition:border-color .2s}
#search::placeholder{color:var(--dim)}
#search:focus{border-color:var(--gold)}
.filter-tabs{display:flex;gap:.3rem}
.ftab{background:transparent;border:1px solid transparent;border-radius:4px;padding:.25rem .55rem;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);transition:all .2s}
.ftab:hover{border-color:var(--border2);color:var(--text)}
.ftab.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.08)}

/* ── Incident list ───────────────────────────────────────────────────────── */
#inc-list{flex:1;overflow-y:auto;overflow-x:hidden}
#inc-list::-webkit-scrollbar{width:4px}
#inc-list::-webkit-scrollbar-track{background:transparent}
#inc-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.inc-item{padding:.75rem .875rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;border-left:3px solid transparent}
.inc-item:hover{background:var(--bg3)}
.inc-item.active{background:var(--bg3);border-left-color:var(--gold)}
.inc-row1{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
.sev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sev-CRITICAL .sev-dot,.dot-CRITICAL{background:var(--crit)}
.sev-HIGH .sev-dot,.dot-HIGH{background:var(--high)}
.sev-MEDIUM .sev-dot,.dot-MEDIUM{background:var(--med)}
.sev-LOW .sev-dot,.dot-LOW{background:var(--low)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.inc-item.status-OPEN .sev-dot{animation:pulse 2s ease-in-out infinite}
.inc-title-sm{font-size:.8125rem;font-weight:500;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.inc-time-sm{font-size:.6875rem;color:var(--dim);flex-shrink:0}
.inc-row2{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.chip-sm{font-size:.6rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:.15rem .4rem;border-radius:3px}
.chip-svc{background:var(--bg);border:1px solid var(--border2);color:var(--muted)}
.chip-env{background:var(--bg);border:1px solid var(--border);color:var(--dim)}
.chip-OPEN{background:rgba(239,68,68,.12);color:var(--open)}
.chip-INVESTIGATING{background:rgba(249,115,22,.12);color:var(--invest)}
.chip-RESOLVED{background:rgba(34,197,94,.12);color:var(--resolved)}
.chip-CLOSED{background:rgba(107,114,128,.12);color:var(--closed)}
.chip-evt{color:var(--dim);background:none;border:none;font-size:.6875rem;letter-spacing:0;font-weight:400;text-transform:none;padding:0}
.inc-empty{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.8125rem;line-height:1.7}
.inc-empty i{font-size:1.5rem;display:block;margin-bottom:.5rem;color:var(--dim)}

/* ── Main panel ──────────────────────────────────────────────────────────── */
.main-panel{overflow-y:auto;background:var(--bg);min-height:0}
.main-panel::-webkit-scrollbar{width:6px}
.main-panel::-webkit-scrollbar-track{background:transparent}
.main-panel::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Welcome state ───────────────────────────────────────────────────────── */
.welcome{display:flex;align-items:center;justify-content:center;height:100%;padding:2rem;text-align:center}
.welcome-inner i{font-size:2rem;color:var(--dim);display:block;margin-bottom:1rem}
.welcome-inner h2{font-family:'Georgia',serif;font-size:1.25rem;font-weight:600;color:var(--text2);margin-bottom:.5rem}
.welcome-inner p{font-size:.875rem;color:var(--muted);line-height:1.65}

/* ── Detail panel ────────────────────────────────────────────────────────── */
.detail{padding:2rem 2.25rem 3rem}

.det-header{border-bottom:1px solid var(--border);padding-bottom:1.25rem;margin-bottom:1.5rem}
.det-badges{display:flex;gap:.5rem;margin-bottom:.75rem}
.badge-sev,.badge-status{display:inline-flex;align-items:center;font-size:.6875rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:.3rem .7rem;border-radius:4px}
.badge-CRITICAL{background:rgba(239,68,68,.15);color:var(--crit);border:1px solid rgba(239,68,68,.3)}
.badge-HIGH{background:rgba(249,115,22,.15);color:var(--high);border:1px solid rgba(249,115,22,.3)}
.badge-MEDIUM{background:rgba(245,158,11,.15);color:var(--med);border:1px solid rgba(245,158,11,.3)}
.badge-LOW{background:rgba(96,165,250,.15);color:var(--low);border:1px solid rgba(96,165,250,.3)}
.badge-OPEN{background:rgba(239,68,68,.1);color:var(--open);border:1px solid rgba(239,68,68,.25)}
.badge-INVESTIGATING{background:rgba(249,115,22,.1);color:var(--invest);border:1px solid rgba(249,115,22,.25)}
.badge-RESOLVED{background:rgba(34,197,94,.1);color:var(--resolved);border:1px solid rgba(34,197,94,.25)}
.badge-CLOSED{background:rgba(107,114,128,.1);color:var(--closed);border:1px solid rgba(107,114,128,.25)}

.det-title{font-family:'Georgia',serif;font-size:1.5rem;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:1rem;letter-spacing:-.01em}
.det-meta{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem}
.det-meta span{display:flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--muted)}
.det-meta i{font-size:14px;color:var(--dim)}

.det-section{margin-bottom:1.75rem}
.section-lbl{display:flex;align-items:center;gap:.4rem;font-size:.6875rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.75rem}
.section-lbl i{font-size:14px}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--border);margin-left:.5rem}
.det-desc{font-size:.875rem;color:var(--text2);line-height:1.75;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:1rem 1.125rem}

/* ── Analysis card ────────────────────────────────────────────────────────── */
.analysis-loading{display:flex;align-items:center;gap:.65rem;font-size:.875rem;color:var(--muted);padding:.75rem 0}
.spinner-sm{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

.analysis-empty{padding:1.5rem;background:var(--bg2);border:1px solid var(--border);border-radius:6px;text-align:center}
.analysis-empty i{font-size:1.5rem;color:var(--dim);display:block;margin-bottom:.5rem}
.analysis-empty p{font-size:.875rem;color:var(--muted);line-height:1.6;margin-bottom:.25rem}
.analysis-empty .hint{font-size:.8rem;color:var(--dim)}
.analysis-empty code{background:var(--bg3);padding:.15rem .4rem;border-radius:3px;font-size:.75rem;font-family:'Courier New',monospace;color:var(--gold)}

.analysis-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:1.25rem 1.375rem}

.conf-row{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.conf-label{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex-shrink:0;width:80px}
.conf-bar-wrap{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden}
.conf-bar{height:100%;border-radius:3px;transition:width .5s ease}
.conf-bar.conf-high{background:var(--conf-high)}
.conf-bar.conf-med{background:var(--conf-med)}
.conf-bar.conf-low{background:var(--conf-low)}
.conf-pct{font-size:.8125rem;font-weight:700;flex-shrink:0;width:38px;text-align:right}
.conf-pct.conf-high{color:var(--conf-high)}
.conf-pct.conf-med{color:var(--conf-med)}
.conf-pct.conf-low{color:var(--conf-low)}
.conf-label-text{font-size:.6875rem;color:var(--dim);flex-shrink:0}

.a-field{margin-bottom:1rem}
.a-field:last-of-type{margin-bottom:0}
.a-lbl{font-size:.6875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:.35rem;display:flex;align-items:center;gap:.3rem}
.a-lbl i{font-size:12px}
.a-val{font-size:.875rem;color:var(--text2);line-height:1.7}
.a-val.cause{color:var(--text);font-weight:500;padding:.625rem .875rem;background:var(--bg3);border-left:3px solid var(--gold);border-radius:0 4px 4px 0}

.chips{display:flex;flex-wrap:wrap;gap:.35rem}
.chip-ev{font-family:'Courier New',monospace;font-size:.7rem;padding:.2rem .55rem;border-radius:3px;background:var(--bg3);border:1px solid var(--border2);color:var(--gold)}

.a-list{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.a-list li{display:flex;align-items:flex-start;gap:.5rem;font-size:.8375rem;color:var(--text2);line-height:1.55}
.a-list li::before{flex-shrink:0;font-family:'tabler-icons';margin-top:.1rem}
.unknown-list li{color:var(--med)}
.unknown-list li::before{content:'\eaa1';color:var(--med)}
.checks-list li::before{content:'\ea5e';color:var(--resolved)}

.a-meta{font-size:.6875rem;color:var(--dim);margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}

/* ── Detail footer ────────────────────────────────────────────────────────── */
.det-footer{display:flex;align-items:center;justify-content:space-between;margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border)}
.det-id{font-family:'Courier New',monospace;font-size:.6875rem;color:var(--dim)}
.api-link{display:inline-flex;align-items:center;gap:.35rem;font-size:.8125rem;color:var(--muted);padding:.35rem .75rem;border:1px solid var(--border2);border-radius:4px;transition:all .2s}
.api-link:hover{border-color:var(--gold);color:var(--gold)}
.api-link i{font-size:13px}
</style>
</head>
<body>

<!-- ── Boot ────────────────────────────────────────────────────────────── -->
<div id="boot">
  <div class="boot-inner">
    <div class="boot-logo">Aether<span>Ops</span></div>
    <div class="boot-sub">Connecting to demo environment…</div>
    <div class="spinner"></div>
  </div>
</div>

<!-- ── Error ────────────────────────────────────────────────────────────── -->
<div id="err-screen">
  <div class="err-inner">
    <i class="ti ti-wifi-off"></i>
    <h2>Unable to connect</h2>
    <p id="err-msg">Could not reach the demo environment. Make sure the server is running.</p>
    <button class="btn-retry" onclick="init()">Retry</button>
  </div>
</div>

<!-- ── App ──────────────────────────────────────────────────────────────── -->
<div id="app">
  <nav>
    <div class="nav-left">
      <a href="/landing.html" class="logo">Aether<span>Ops</span></a>
      <span class="demo-badge">Demo</span>
    </div>
    <div class="nav-stats" id="nav-stats"></div>
    <div class="nav-right">
      <a href="/landing.html" class="nav-link"><i class="ti ti-arrow-left"></i> Back to site</a>
      <a href="/swagger-ui.html" target="_blank" class="nav-link"><i class="ti ti-code"></i> API docs</a>
      <button class="theme-btn" onclick="toggleTheme()">
        <i class="ti ti-sun" id="themeIcon"></i>
        <span id="themeLabel">Light</span>
      </button>
    </div>
  </nav>

  <div class="layout">
    <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="search-wrap">
          <i class="ti ti-search"></i>
          <input type="search" id="search" placeholder="Search incidents…" oninput="onSearch(this.value)" autocomplete="off">
        </div>
        <div class="filter-tabs">
          <button class="ftab active" id="ftab-ALL"      onclick="setFilter('ALL')">All</button>
          <button class="ftab"        id="ftab-OPEN"     onclick="setFilter('OPEN')">Open</button>
          <button class="ftab"        id="ftab-CRITICAL" onclick="setFilter('CRITICAL')">Critical</button>
          <button class="ftab"        id="ftab-RESOLVED" onclick="setFilter('RESOLVED')">Resolved</button>
        </div>
      </div>
      <div id="inc-list"></div>
    </aside>

    <!-- ── Main panel ─────────────────────────────────────────────────── -->
    <main class="main-panel" id="main-panel">
      <div class="welcome" id="welcome">
        <div class="welcome-inner">
          <i class="ti ti-activity-heartbeat"></i>
          <h2>Select an incident</h2>
          <p>Choose an incident from the sidebar to view details and AI-powered root cause analysis.</p>
        </div>
      </div>
      <div class="detail" id="detail" style="display:none"></div>
    </main>
  </div>
</div>

<script>
'use strict';

/* ── State ──────────────────────────────────────────────────────────────── */
const S = {
  token:     null,
  tenantId:  null,
  incidents: [],
  selected:  null,
  analyses:  {},
  filter:    'ALL',
  search:    ''
};

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function trunc(s, n) {
  return s && s.length > n ? s.slice(0, n - 1) + '…' : (s || '');
}

function timeAgo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 2)  return 'just now';
  if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  const d = Math.floor(h / 24);
  return d + 'd ago';
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString(undefined, {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch(path, { headers, ...opts });
  const json = await res.json();
  if (!res.ok) throw Object.assign(new Error(json.error || 'HTTP ' + res.status), { status: res.status });
  return json;
}

/* ── Init ────────────────────────────────────────────────────────────────── */
async function init() {
  document.getElementById('err-screen').classList.remove('show');
  document.getElementById('boot').style.display = 'flex';
  document.getElementById('app').style.display  = 'none';

  try {
    // 1. Get pre-authenticated demo JWT
    const authRes = await api('/api/v1/demo/auth');
    S.token    = authRes.data.token;
    S.tenantId = authRes.data.tenantId;

    // 2. Load incidents
    const incRes = await api('/api/v1/incidents?tenantId=' + S.tenantId + '&size=50&sort=lastSeenAt,desc');
    S.incidents  = incRes.data.content || [];

    // 3. Render chrome
    renderStats();
    renderList();

    // 4. Auto-select first incident
    if (S.incidents.length > 0) selectIncident(S.incidents[0]);

    // 5. Transition to app
    document.getElementById('boot').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('boot').style.display = 'none';
      document.getElementById('app').style.display  = 'flex';
    }, 280);

  } catch (e) {
    document.getElementById('boot').style.display = 'none';
    document.getElementById('err-msg').textContent = e.message || 'Unexpected error';
    document.getElementById('err-screen').classList.add('show');
  }
}

/* ── Stats nav chips ─────────────────────────────────────────────────────── */
function renderStats() {
  const total    = S.incidents.length;
  const open     = S.incidents.filter(i => i.status === 'OPEN').length;
  const crit     = S.incidents.filter(i => i.severity === 'CRITICAL').length;
  const resolved = S.incidents.filter(i => i.status === 'RESOLVED').length;

  document.getElementById('nav-stats').innerHTML = [
    chip('dot-total',  total + ' total'),
    chip('dot-open',   open + ' open'),
    chip('dot-crit',   crit + ' critical'),
    chip('dot-res',    resolved + ' resolved')
  ].join('');
}

function chip(dotCls, label) {
  return `<span class="stat-chip"><span class="dot ${dotCls}"></span>${esc(label)}</span>`;
}

/* ── Sidebar list ─────────────────────────────────────────────────────────── */
function filteredIncidents() {
  const q = S.search.toLowerCase().trim();
  return S.incidents.filter(i => {
    const matchFilter =
      S.filter === 'ALL'      ? true :
      S.filter === 'OPEN'     ? i.status === 'OPEN' :
      S.filter === 'CRITICAL' ? i.severity === 'CRITICAL' :
      S.filter === 'RESOLVED' ? i.status === 'RESOLVED' : true;
    const matchSearch = !q ||
      i.title.toLowerCase().includes(q) ||
      i.serviceId.toLowerCase().includes(q) ||
      (i.environment || '').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function renderList() {
  const incidents = filteredIncidents();
  const list = document.getElementById('inc-list');

  if (!incidents.length) {
    list.innerHTML = `<div class="inc-empty"><i class="ti ti-inbox"></i>No incidents match this filter.</div>`;
    return;
  }

  list.innerHTML = incidents.map(i => {
    const active = S.selected?.id === i.id ? ' active' : '';
    return `
      <div class="inc-item sev-${esc(i.severity)} status-${esc(i.status)}${active}" id="item-${esc(i.id)}" onclick="selectIncident(incById('${esc(i.id)}'))">
        <div class="inc-row1">
          <span class="sev-dot"></span>
          <span class="inc-title-sm">${esc(trunc(i.title, 50))}</span>
          <span class="inc-time-sm">${esc(timeAgo(i.lastSeenAt))}</span>
        </div>
        <div class="inc-row2">
          <span class="chip-sm chip-svc">${esc(i.serviceId)}</span>
          ${i.environment ? `<span class="chip-sm chip-env">${esc(i.environment)}</span>` : ''}
          <span class="chip-sm chip-${esc(i.status)}">${esc(i.status)}</span>
          <span class="chip-sm chip-evt">${i.eventCount} event${i.eventCount !== 1 ? 's' : ''}</span>
        </div>
      </div>`;
  }).join('');
}

function incById(id) {
  return S.incidents.find(i => i.id === id);
}

/* ── Filter & search ─────────────────────────────────────────────────────── */
function setFilter(f) {
  S.filter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  const tab = document.getElementById('ftab-' + f);
  if (tab) tab.classList.add('active');
  renderList();
}

function onSearch(val) {
  S.search = val;
  renderList();
}

/* ── Incident detail ─────────────────────────────────────────────────────── */
function selectIncident(incident) {
  if (!incident) return;
  S.selected = incident;
  renderList();

  document.getElementById('welcome').style.display = 'none';
  const det = document.getElementById('detail');
  det.style.display = 'block';
  det.innerHTML = buildDetail(incident);

  document.getElementById('main-panel').scrollTop = 0;
  loadAnalysis(incident);
}

function buildDetail(i) {
  return `
    <div class="det-header">
      <div class="det-badges">
        <span class="badge-sev badge-${esc(i.severity)}">${esc(i.severity)}</span>
        <span class="badge-status badge-${esc(i.status)}">${esc(i.status)}</span>
      </div>
      <div class="det-title">${esc(i.title)}</div>
      <div class="det-meta">
        <span><i class="ti ti-server-2"></i> ${esc(i.serviceId)}</span>
        ${i.environment ? `<span><i class="ti ti-world"></i> ${esc(i.environment)}</span>` : ''}
        <span><i class="ti ti-stack-2"></i> ${i.eventCount} event${i.eventCount !== 1 ? 's' : ''}</span>
        <span><i class="ti ti-clock"></i> First seen ${esc(timeAgo(i.firstSeenAt))}</span>
        <span><i class="ti ti-refresh"></i> Last seen ${esc(timeAgo(i.lastSeenAt))}</span>
        ${i.resolvedAt ? `<span><i class="ti ti-circle-check"></i> Resolved ${esc(timeAgo(i.resolvedAt))}</span>` : ''}
      </div>
    </div>

    ${i.description ? `
    <div class="det-section">
      <div class="section-lbl"><i class="ti ti-notes"></i> Description</div>
      <div class="det-desc">${esc(i.description)}</div>
    </div>` : ''}

    <div class="det-section">
      <div class="section-lbl"><i class="ti ti-brain"></i> AI Analysis</div>
      <div id="analysis-body">
        <div class="analysis-loading"><div class="spinner-sm"></div> Loading analysis…</div>
      </div>
    </div>

    <div class="det-footer">
      <span class="det-id">ID ${esc(i.id)}</span>
      <a class="api-link" href="/swagger-ui.html#/Incidents" target="_blank">
        <i class="ti ti-external-link"></i> Explore in API docs
      </a>
    </div>`;
}

/* ── AI Analysis ─────────────────────────────────────────────────────────── */
async function loadAnalysis(incident) {
  // Return cached result immediately if available
  if (S.analyses[incident.id]) {
    renderAnalysis(S.analyses[incident.id]);
    return;
  }

  const body = document.getElementById('analysis-body');
  if (!body) return;

  try {
    const res = await api('/api/v1/incidents/' + incident.id + '/analyze/latest?tenantId=' + S.tenantId);
    S.analyses[incident.id] = res.data;

    // Only render if this incident is still selected
    if (S.selected?.id === incident.id) renderAnalysis(res.data);

  } catch (e) {
    if (S.selected?.id !== incident.id) return;
    const el = document.getElementById('analysis-body');
    if (!el) return;
    if (e.status === 404 || (e.message && e.message.toLowerCase().includes('not found'))) {
      el.innerHTML = `
        <div class="analysis-empty">
          <i class="ti ti-brain"></i>
          <p>No AI analysis has been run on this incident yet.</p>
          <p class="hint">Trigger one via the API: <code>POST /api/v1/incidents/${esc(incident.id)}/analyze?tenantId=${esc(S.tenantId)}</code></p>
        </div>`;
    } else {
      el.innerHTML = `<div class="analysis-empty"><i class="ti ti-alert-circle"></i><p>Analysis unavailable: ${esc(e.message)}</p></div>`;
    }
  }
}

function renderAnalysis(a) {
  const el = document.getElementById('analysis-body');
  if (!el) return;

  const pct       = Math.round((a.confidenceScore || 0) * 100);
  const confClass = pct >= 70 ? 'conf-high' : pct >= 40 ? 'conf-med' : 'conf-low';
  const confLbl   = pct >= 70 ? 'High' : pct >= 40 ? 'Moderate' : 'Low';

  const evidenceHtml = (a.evidenceRefs?.length) ? `
    <div class="a-field">
      <div class="a-lbl"><i class="ti ti-fingerprint"></i> Evidence References</div>
      <div class="chips">${a.evidenceRefs.map(r => `<span class="chip-ev">${esc(r)}</span>`).join('')}</div>
    </div>` : '';

  const unknownsHtml = (a.unknowns?.length) ? `
    <div class="a-field">
      <div class="a-lbl" style="color:var(--med)"><i class="ti ti-alert-triangle"></i> Unknowns</div>
      <ul class="a-list unknown-list">${a.unknowns.map(u => `<li>${esc(u)}</li>`).join('')}</ul>
    </div>` : '';

  const checksHtml = (a.recommendedNextChecks?.length) ? `
    <div class="a-field">
      <div class="a-lbl"><i class="ti ti-checklist"></i> Recommended Next Checks</div>
      <ul class="a-list checks-list">${a.recommendedNextChecks.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    </div>` : '';

  el.innerHTML = `
    <div class="analysis-card">
      <div class="conf-row">
        <span class="conf-label">Confidence</span>
        <div class="conf-bar-wrap"><div class="conf-bar ${confClass}" style="width:0%" id="conf-bar-anim"></div></div>
        <span class="conf-pct ${confClass}">${pct}%</span>
        <span class="conf-label-text">${confLbl}</span>
      </div>

      <div class="a-field">
        <div class="a-lbl"><i class="ti ti-message-dots"></i> Summary</div>
        <div class="a-val">${esc(a.summary || '—')}</div>
      </div>

      <div class="a-field">
        <div class="a-lbl"><i class="ti ti-target"></i> Likely Cause</div>
        <div class="a-val cause">${esc(a.likelyCause || '—')}</div>
      </div>

      ${evidenceHtml}
      ${unknownsHtml}
      ${checksHtml}

      <div class="a-meta">
        Model: ${esc(a.model || 'claude')} &nbsp;·&nbsp;
        Analysis v${a.analysisVersion || 1} &nbsp;·&nbsp;
        ${a.evidenceCount || 0} evidence item${(a.evidenceCount || 0) !== 1 ? 's' : ''} &nbsp;·&nbsp;
        ${esc(timeAgo(a.createdAt))}
      </div>
    </div>`;

  // Animate bar after paint
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const bar = document.getElementById('conf-bar-anim');
      if (bar) bar.style.width = pct + '%';
    });
  });
}

/* ── Theme ────────────────────────────────────────────────────────────────── */
function toggleTheme() {
  const html  = document.documentElement;
  const dark  = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeIcon').className  = dark ? 'ti ti-moon'  : 'ti ti-sun';
  document.getElementById('themeLabel').textContent = dark ? 'Light' : 'Dark';
}

/* ── Boot ─────────────────────────────────────────────────────────────────── */
init();
</script>
</body>
</html>
